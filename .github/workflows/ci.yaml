name: CI

on:
  push:
    branches: [main, develop, rc]
  pull_request:
    branches: [main, develop, rc]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          PY_DEP_TOKEN: ${{ secrets.PY_DEP_TOKEN }}
        run: |
          if [ -z "$PY_DEP_TOKEN" ]; then
            echo "PY_DEP_TOKEN is empty"
            exit 1
          fi
          git config --global url."https://x-access-token:${PY_DEP_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          uv sync --all-extras --dev

      - name: Lint (ruff)
        run: |
          uv run ruff check src/

      - name: Type check (mypy)
        run: |
          uv run mypy src/

      - name: Tests (pytest)
        run: |
          uv run pytest

[project]
name = "fastapi-baseline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "annotated-types==0.7.0",
    "anyio==4.6.2.post1",
    "asyncpg>=0.30.0",
    "click==8.1.7",
    "colorama==0.4.6",
    "configparser==7.1.0",
    "exceptiongroup==1.2.2",
    "fastapi==0.115.6",
    "h11==0.14.0",
    "idna==3.10",
    "loguru>=0.7.0",
    # OpenTelemetry - Core
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-semantic-conventions>=0.41b0",
    # OpenTelemetry - Exporters
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    # OpenTelemetry - Propagators
    "opentelemetry-propagator-b3>=1.20.0",
    # OpenTelemetry - Instrumentation
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.41b0",
    "opentelemetry-instrumentation-logging>=0.41b0",
    "orjson>=3.11.1",
    "pydantic==2.10.3",
    "pydantic-core==2.27.1",
    "pydantic-settings>=2.11.0",
    "sniffio==1.3.1",
    "starlette==0.41.3",
    "tenacity>=8.2.0",
    "typing-extensions==4.12.2",
    "uvicorn==0.32.1",
    "faststream[rabbit]>=0.6.4",
    "aioboto3>=15.5.0",
    "sqlalchemy>=2.0.51",
    "pgvector>=0.5.0",
    "python-magic-bin>=0.4.14",
    "alembic>=1.18.5",
    "sentence-transformers>=5.6.1",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "docx>=0.2.4",
    "numpy>=2.5.1",
    "transformers<5.0",
    "torch",
]

# ---------------------------------------------------------------------------
# GPU torch: PyPI's default "torch" wheel for Windows/Linux is CPU-only.
# Point uv at PyTorch's own CUDA index instead. Pick the index that matches
# the CUDA version your NVIDIA driver supports (check with `nvidia-smi`,
# top-right "CUDA Version" field) - cu121 / cu124 / cu128 are common.
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[dependency-groups]
dev = [
    "commitizen>=4.9.1",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"